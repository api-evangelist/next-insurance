aid: next-insurance
name: ERGO NEXT Insurance
description: ERGO NEXT Insurance (formerly NEXT Insurance) is a Palo Alto, California
  technology-first Property & Casualty insurer focused on the specific needs of U.S.
  small and medium-sized business owners. Founded in 2016, the company offers fully
  digital commercial coverage including General Liability, Workers' Compensation,
  Business Owner's Policy (BOP), Professional Liability / Errors & Omissions, Commercial
  Property, Commercial Auto, Tools & Equipment, Employment Practices Liability, Product
  Liability, and Liquor Liability — serving more than 750,000 customers across 1,300+
  professions. In March 2025 Munich Re signed a definitive agreement to acquire 100%
  of NEXT Insurance at a valuation of $2.6 billion; ERGO Group AG (Munich Re's primary
  insurance arm) closed the full acquisition on July 1, 2025 and on January 15, 2026
  the company rebranded as ERGO NEXT Insurance, becoming Munich Re/ERGO's foothold
  in the U.S. SMB market. ERGO NEXT's partner-facing surface is NEXT Connect, an embedded
  insurance platform that lets payroll, point-of-sale, accounting, e-commerce, payments,
  banking, and fintech platforms quote and bind small-business coverage from within
  their own product through low-code components and API calls. NEXT Connect aggregates
  15+ carriers (including ERGO NEXT itself, Travelers, Liberty Mutual, Chubb, CNA,
  The Hartford) and is documented in the wild through embedded-payroll partners such
  as Check, Gusto Embedded, Intuit QuickBooks, Square, LegalZoom, and Amazon Business
  Prime, but ERGO NEXT does not publish a public developer portal, OpenAPI specification,
  or self-serve SDKs — partner onboarding is gated through a partnerships team. The
  company also offers a pay-as-you-go Workers' Comp product that integrates with partner
  payroll runs so premium is calculated against actual per-cycle W-2 wages.
